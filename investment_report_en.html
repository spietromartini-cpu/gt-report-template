<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GT Global Estates — Investment Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── WEASYPRINT BULLETPROOF PAGE SETUP ───────────── */
  @page {
    size: A4;
    margin: 0mm;
  }

  /* ── Reset & Page Setup ─────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold:   #B7791F;
    --gold-lt:#D4943A;
    --navy:   #0D1B2A;
    --navy2:  #0A1520;
    --navy3:  #111F30;
    --cream:  #F5F5F0;
    --muted:  #8A95A3;
    --green:  #4ADE80;
    --amber:  #F0C060;
    --red:    #F87171;
    --fh: 'Cormorant Garamond', Georgia, serif;
    --fb: 'Montserrat', sans-serif;
  }

  html { 
    font-size: 10pt; 
    margin: 0; 
    padding: 0; 
  }

  body {
    font-family: var(--fb);
    background-color: #0D1B2A;
    color: var(--cream);
    margin: 0;
    padding: 0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ── Page Layout ─────────────────────────────────────── */
  .page {
    width: 210mm;
    height: 296mm;
    box-sizing: border-box;
    margin: 0 auto;
    background-color: var(--navy);
    position: relative;
    page-break-after: always;
    break-after: page;
    overflow: hidden;
  }

  .page:last-child {
    page-break-after: avoid;
    break-after: auto;
  }

  @media print {
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
    .page { margin: 0; }
  }

  /* ── Common Elements ─────────────────────────────────── */
  .gold { color: var(--gold); }
  .muted { color: var(--muted); }

  .page-footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 14px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(183,121,31,0.15);
    background: rgba(9,14,22,0.6);
  }
  .page-footer span {
    font-family: var(--fb);
    font-size: 6.5pt;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .page-footer .ft-date { color: var(--gold); }

  .logo-block {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  .logo-mark {
    font-family: var(--fh);
    font-size: 22pt;
    font-weight: 300;
    color: var(--gold);
    letter-spacing: .06em;
    line-height: 1;
  }
  .logo-sub {
    font-family: var(--fb);
    font-size: 5.5pt;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 3px;
  }

  .sec-kicker {
    font-family: var(--fb);
    font-size: 6pt;
    font-weight: 700;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .sec-kicker::before { content: '◆'; font-size: 5pt; }

  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, rgba(183,121,31,.5), transparent);
    margin: 20px 0;
  }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
  }

  .col-label {
    font-family: var(--fb);
    font-size: 6pt;
    font-weight: 700;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }

  .body-text {
    font-family: var(--fb);
    font-size: 7.5pt;
    font-weight: 300;
    color: rgba(245,245,240,.75);
    line-height: 1.85;
  }

  /* ── TABLE ───────────────────────────────────────────── */
  .data-table { width: 100%; border-collapse: collapse; }
  .data-table tr { border-bottom: 1px solid rgba(183,121,31,.1); }
  .data-table td {
    padding: 8px 0;
    font-family: var(--fb);
    font-size: 7.5pt;
  }
  .data-table td:first-child { color: var(--gold); font-weight: 500; }
  .data-table td:last-child  { color: var(--cream); text-align: right; }

  /* ── BADGE ───────────────────────────────────────────── */
  .badge {
    display: inline-block;
    padding: 4px 12px;
    font-family: var(--fb);
    font-size: 6pt;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    border-radius: 2px;
  }
  .badge-ok     { background: rgba(74,222,128,.15); color: var(--green); border: 1px solid rgba(74,222,128,.3); }
  .badge-alert  { background: rgba(248,113,113,.12); color: var(--red);   border: 1px solid rgba(248,113,113,.3); }
  .badge-warn   { background: rgba(240,192,96,.12);  color: var(--amber); border: 1px solid rgba(240,192,96,.3); }

  /* ═══════════════════════════════════════════════════════
     PAGE 1 — COVER
  ═══════════════════════════════════════════════════════ */
  #p1 {
    background:
      radial-gradient(ellipse at 10% 20%, rgba(183,121,31,.08) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 75%, rgba(13,27,42,.9) 0%, transparent 60%),
      #0D1B2A;
    padding: 48px;
    display: block; 
  }

  .cover-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .cover-tag {
    font-family: var(--fb);
    font-size: 6pt;
    font-weight: 700;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 8px;
  }
  .cover-tag::before { content: ''; display: block; width: 32px; height: 1px; background: var(--gold); }

  .cover-center { 
    margin-top: 140px; 
  }

  .cover-h1 {
    font-family: var(--fh);
    font-size: 44pt;
    font-weight: 300;
    color: var(--cream);
    line-height: .95;
    letter-spacing: -.01em;
    margin-bottom: 24px;
  }
  .cover-h1 em { font-style: italic; color: var(--gold); }

  .cover-sub {
    font-family: var(--fb);
    font-size: 8pt;
    font-weight: 300;
    color: rgba(245,245,240,.55);
    letter-spacing: .04em;
    margin-bottom: 40px;
  }

  .cover-line {
    width: 60px;
    height: 1px;
    background: var(--gold);
    margin-bottom: 30px;
  }

  .cover-for {
    font-family: var(--fb);
    font-size: 6pt;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .cover-client {
    font-family: var(--fh);
    font-size: 18pt;
    font-weight: 400;
    color: var(--gold);
  }

  .cover-strip {
    position: absolute;
    bottom: 60px;
    left: 48px;
    right: 48px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-top: 1px solid rgba(183,121,31,.15);
    padding-top: 18px;
  }
  .cs-item { display: flex; flex-direction: column; gap: 4px; }
  .cs-label {
    font-family: var(--fb);
    font-size: 5.5pt;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .cs-val {
    font-family: var(--fh);
    font-size: 12pt;
    font-weight: 300;
    color: var(--cream);
  }

  /* ═══════════════════════════════════════════════════════
     PAGE 2 — EXECUTIVE SUMMARY / DASHBOARD (YES/NO UPDATE)
  ═══════════════════════════════════════════════════════ */
  #p2 {
    background-color: var(--navy);
    padding: 48px 48px 80px;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 28px;
  }

  .kpi-card {
    background: rgba(13,27,42,.7);
    border: 1px solid rgba(183,121,31,.22);
    padding: 24px 26px 20px;
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  .kpi-label {
    font-family: var(--fb);
    font-size: 6pt;
    font-weight: 700;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
  }
  .kpi-value {
    font-family: var(--fh);
    font-size: 30pt;
    font-weight: 300;
    color: var(--cream);
    line-height: 1;
    margin-bottom: 6px;
  }
  .kpi-unit {
    font-family: var(--fb);
    font-size: 6.5pt;
    letter-spacing: .15em;
    color: var(--muted);
  }

  .score-bar-wrap { margin-top: 28px; }
  .score-bar-track {
    width: 100%;
